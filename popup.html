<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilot - Coursera AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --primary-glow: rgba(99, 102, 241, 0.35);
      
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --accent-glow: rgba(16, 185, 129, 0.3);
      
      --secondary-bg: rgba(31, 41, 55, 0.8);
      --secondary-hover: rgba(55, 65, 81, 0.9);
      --secondary-border: rgba(255, 255, 255, 0.1);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient: linear-gradient(145deg, #f8fafc 0%, #edf2f7 100%);
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(226, 232, 240, 0.9);
        --card-hover-border: rgba(99, 102, 241, 0.4);
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-dim: #94a3b8;
        
        --secondary-bg: #f1f5f9;
        --secondary-hover: #e2e8f0;
        --secondary-border: #cbd5e1;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 375px;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(20px);
    }

    /* Modern App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #10b981;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon-wrap {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Custom Input with Password Toggle */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-field-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--secondary-border);
      background-color: rgba(0, 0, 0, 0.15);
      padding: 0 36px 0 12px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    @media (prefers-color-scheme: light) {
      input {
        background-color: #ffffff;
      }
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
    }

    .btn-secondary {
      background: var(--secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--secondary-border);
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-sm {
      height: 38px;
      padding: 0 14px;
      white-space: nowrap;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
    }

    #status {
      color: #10b981;
      font-weight: 600;
    }

    .link-key {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1 class="app-title">SkillPilot</h1>
        <span class="app-subtitle">Coursera AI Assistant</span>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Active
    </div>
  </header>

  <!-- Section: API Setup -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <span class="card-title">Gemini API Setup</span>
    </div>
    
    <div class="input-wrapper">
      <div class="input-field-container">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key" autocomplete="off">
        <button type="button" id="togglePasswordBtn" class="toggle-pw-btn" title="Toggle visibility">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button id="saveBtn" class="btn btn-secondary btn-sm">Save</button>
    </div>

    <div class="meta-row">
      <div id="status"></div>
      <a href="https://ai.google.dev/aistudio" target="_blank" class="link-key">Get Free API Key →</a>
    </div>
  </section>

  <div class="section">
    <button id="explainBtn" class="btn btn-primary">Solve Current Quiz</button>
    <button id="showQuestionsBtn" class="btn btn-secondary">Copy Questions Only</button>
    <div id="result"></div>
  </div>

  <div class="section">
    <button id="completeVideosBtn" class="btn btn-accent">Complete Materials</button>
  </div>

  <div class="footer">
    <span>created by <a href="https://github.com/Youssef-Ghafir" target="_blank">YG</a></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
