<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilot - Coursera AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      padding: 18px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0e17;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7047eb 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(112, 71, 235, 0.35);
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #10b981;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    /* Cards */
    .card {
      background: #111726;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon-wrap.green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .card-desc {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: -4px;
      line-height: 1.4;
    }

    /* Inputs */
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-field-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #283548;
      background-color: #0b0e17;
      padding: 0 38px 0 12px;
      font-size: 0.84rem;
      font-family: inherit;
      color: #ffffff;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
    }

    input::placeholder {
      color: #64748b;
    }

    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-pw-btn:hover {
      color: #94a3b8;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      font-family: inherit;
      height: 42px;
      padding: 0 16px;
      cursor: pointer;
      width: 100%;
      border: none;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-save {
      width: auto;
      height: 40px;
      padding: 0 18px;
      background-color: #232a3b;
      color: #ffffff;
      border: 1px solid #334155;
    }

    .btn-save:hover {
      background-color: #2d374d;
    }

    .btn-quiz {
      background: #5442e6;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(84, 66, 230, 0.3);
    }

    .btn-quiz:hover:not(:disabled) {
      background: #4634d6;
    }

    .btn-copy {
      background: #172033;
      color: #ffffff;
      border: 1px solid #27344d;
    }

    .btn-copy:hover:not(:disabled) {
      background: #1e2a42;
    }

    .btn-media {
      background: #00a86b;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 168, 107, 0.3);
    }

    .btn-media:hover:not(:disabled) {
      background: #00965f;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .meta-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: -4px;
    }

    #status {
      font-size: 0.72rem;
      color: #10b981;
      font-weight: 600;
      margin-right: auto;
    }

    .link-key {
      font-size: 0.72rem;
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }

    .link-key:hover {
      text-decoration: underline;
    }

    #result {
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 12px;
      border-radius: 8px;
      background: #0b0e17;
      border: 1px solid #1e293b;
      color: #f1f5f9;
      display: none;
      max-height: 150px;
      overflow-y: auto;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .attribution {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .attribution a {
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
    }

    .attribution a:hover {
      text-decoration: underline;
    }

    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #172033;
      border: 1px solid #27344d;
      border-radius: 20px;
      color: #ffffff !important;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
    }

    .update-badge:hover {
      background: #1e2a42;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1 class="app-title">SkillPilot</h1>
        <span class="app-subtitle">Coursera AI Assistant</span>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Active
    </div>
  </header>

  <!-- Section: API Setup -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <span class="card-title">Gemini API Setup</span>
    </div>
    
    <div class="input-wrapper">
      <div class="input-field-container">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key" autocomplete="off">
        <button type="button" id="togglePasswordBtn" class="toggle-pw-btn" title="Toggle visibility">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button id="saveBtn" class="btn btn-save">Save</button>
    </div>

    <div class="meta-row">
      <div id="status"></div>
      <a href="https://ai.google.dev/aistudio" target="_blank" class="link-key">Get Free API Key →</a>
    </div>
  </section>

  <!-- Section: Smart Quiz Solver -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </div>
      <span class="card-title">AI Quiz Solver</span>
    </div>
    <span class="card-desc">Automatically detect and solve assignment questions silently.</span>
    
    <button id="explainBtn" class="btn btn-quiz">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Solve Current Quiz
    </button>
    
    <button id="showQuestionsBtn" class="btn btn-copy">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Questions Only
    </button>

    <div id="result"></div>
  </section>

  <!-- Section: Media Automation -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap green">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="card-title">Media Automation</span>
    </div>
    <span class="card-desc">Instantly mark lectures, videos, and readings as completed.</span>

    <button id="completeVideosBtn" class="btn btn-media">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Complete Materials
    </button>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="attribution">
      Made by <a href="https://github.com/Prince94-p" target="_blank">Prince Patel</a>
    </div>
    <a href="https://github.com/Prince94-p/SkillPilot" target="_blank" class="update-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      Check for updates
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
