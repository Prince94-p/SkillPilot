<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilot - Coursera AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --primary-glow: rgba(99, 102, 241, 0.35);
      
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --accent-glow: rgba(16, 185, 129, 0.3);
      
      --secondary-bg: rgba(31, 41, 55, 0.8);
      --secondary-hover: rgba(55, 65, 81, 0.9);
      --secondary-border: rgba(255, 255, 255, 0.1);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient: linear-gradient(145deg, #f8fafc 0%, #edf2f7 100%);
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(226, 232, 240, 0.9);
        --card-hover-border: rgba(99, 102, 241, 0.4);
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-dim: #94a3b8;
        
        --secondary-bg: #f1f5f9;
        --secondary-hover: #e2e8f0;
        --secondary-border: #cbd5e1;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 375px;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(20px);
    }

    /* Modern App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #10b981;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon-wrap {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon-wrap.accent {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: -6px;
      line-height: 1.35;
    }

    /* Custom Input with Password Toggle */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-field-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--secondary-border);
      background-color: rgba(0, 0, 0, 0.15);
      padding: 0 36px 0 12px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    @media (prefers-color-scheme: light) {
      input {
        background-color: #ffffff;
      }
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
    }

    .toggle-pw-btn:hover {
      color: var(--text-main);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      height: 40px;
      padding: 0 16px;
      cursor: pointer;
      width: 100%;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }

    .btn-accent {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-accent:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
    }

    .btn-secondary {
      background: var(--secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--secondary-border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-sm {
      height: 38px;
      padding: 0 14px;
      width: auto;
      white-space: nowrap;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
    }

    #status {
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .link-key {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.15s ease;
    }

    .link-key:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    /* Output Results Box */
    #result {
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 12px;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: none;
      max-height: 160px;
      overflow-y: auto;
      backdrop-filter: blur(6px);
    }

    #result::-webkit-scrollbar {
      width: 4px;
    }
    #result::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Loading Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Styled Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .attribution {
      font-weight: 500;
      color: var(--text-muted);
    }

    .attribution a {
      color: #818cf8;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .attribution a:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--secondary-bg);
      border: 1px solid var(--secondary-border);
      border-radius: 20px;
      color: var(--text-main) !important;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .update-badge:hover {
      background: var(--secondary-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .update-badge svg {
      color: #818cf8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1 class="app-title">SkillPilot</h1>
        <span class="app-subtitle">Coursera AI Assistant</span>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Active
    </div>
  </header>

  <!-- Section: API Setup -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <span class="card-title">Gemini API Setup</span>
    </div>
    
    <div class="input-wrapper">
      <div class="input-field-container">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key" autocomplete="off">
        <button type="button" id="togglePasswordBtn" class="toggle-pw-btn" title="Toggle visibility">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button id="saveBtn" class="btn btn-secondary btn-sm">Save</button>
    </div>

    <div class="meta-row">
      <div id="status"></div>
      <a href="https://ai.google.dev/aistudio" target="_blank" class="link-key">Get Free API Key →</a>
    </div>
  </section>

  <!-- Section: Smart Quiz Solver -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </div>
      <span class="card-title">AI Quiz Solver</span>
    </div>
    <span class="card-desc">Automatically detect and solve assignment questions silently.</span>
    
    <button id="explainBtn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Solve Current Quiz
    </button>
    
    <button id="showQuestionsBtn" class="btn btn-secondary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Questions Only
    </button>

    <div id="result"></div>
  </section>

  <!-- Section: Media Automation -->
  <section class="card">
    <div class="card-header">
      <div class="card-icon-wrap accent">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="card-title">Media Automation</span>
    </div>
    <span class="card-desc">Instantly mark lectures, videos, and readings as completed.</span>

    <button id="completeVideosBtn" class="btn btn-accent">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Complete Materials
    </button>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="attribution">
      Made by <a href="https://github.com/Prince94-p" target="_blank">Prince Patel</a>
    </div>
    <a href="https://github.com/Prince94-p/SkillPilot" target="_blank" class="update-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      Check for updates
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
