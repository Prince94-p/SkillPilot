<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPilot - Coursera AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --primary-glow: rgba(99, 102, 241, 0.35);
      
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --accent-glow: rgba(16, 185, 129, 0.3);
      
      --secondary-bg: rgba(31, 41, 55, 0.8);
      --secondary-hover: rgba(55, 65, 81, 0.9);
      --secondary-border: rgba(255, 255, 255, 0.1);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-gradient: linear-gradient(145deg, #f8fafc 0%, #edf2f7 100%);
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(226, 232, 240, 0.9);
        --card-hover-border: rgba(99, 102, 241, 0.4);
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-dim: #94a3b8;
        
        --secondary-bg: #f1f5f9;
        --secondary-hover: #e2e8f0;
        --secondary-border: #cbd5e1;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 375px;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(20px);
    }

    /* Modern App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #10b981;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1 class="app-title">SkillPilot</h1>
        <span class="app-subtitle">Coursera AI Assistant</span>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Active
    </div>
  </header>

  <div class="section">
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key" autocomplete="off">
      <button id="saveBtn" class="btn btn-secondary">Save</button>
    </div>
    <div class="meta-row">
      <div id="status"></div>
      <a href="https://ai.google.dev/aistudio" target="_blank" class="link">Get Free Key →</a>
    </div>
  </div>

  <div class="section">
    <button id="explainBtn" class="btn btn-primary">Solve Current Quiz</button>
    <button id="showQuestionsBtn" class="btn btn-secondary">Copy Questions Only</button>
    <div id="result"></div>
  </div>

  <div class="section">
    <button id="completeVideosBtn" class="btn btn-accent">Complete Materials</button>
  </div>

  <div class="footer">
    <span>created by <a href="https://github.com/Youssef-Ghafir" target="_blank">YG</a></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
